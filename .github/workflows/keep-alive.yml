name: keep-alive
# GitHub disables scheduled workflows after 60 days of no repo activity.
# This pushes a tiny heartbeat commit weekly so distribute + burn-bb never get turned off.
on:
  schedule:
    - cron: "7 6 * * 1"      # weekly, Monday 06:07 UTC (offset from the on-chain crons)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: heartbeat commit
        run: |
          git config user.name "TrackingEth"
          git config user.email "125228750+TrackingEth@users.noreply.github.com"
          echo "last keep-alive: $(date -u +%FT%TZ)" > .heartbeat
          git add .heartbeat
          git commit -m "keep-alive heartbeat" || { echo "nothing to commit"; exit 0; }
          git push
