name: distribute
# Buys the 8 stocks with the accumulated 4% treasury pot and pushes rewards to holders.
# buyAll is permissionless + pays the caller 1%, so it is self-funding once volume is there.
on:
  schedule:
    - cron: "7 * * * *"      # hourly at :07 — :00 slots are the most congested on github and get skipped/delayed
  workflow_dispatch:
    inputs:
      min_pot_eth:
        description: "Override MIN_POT_ETH for this manual run only (scheduled runs always use 0.1)"
        required: false
        default: "0.1"
      drain_to_eth:
        description: "Override DRAIN_TO_ETH for this manual run only (scheduled runs always use 0.002)"
        required: false
        default: "0.002"
      dry_run:
        description: "true = simulate via staticCall and send nothing (scheduled runs never set this)"
        required: false
        default: "false"
concurrency:
  group: keeper-onchain      # shared with burn-bb so they never send txs from the same wallet at once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node keeper-loop.js
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          RPC: ${{ secrets.RPC }}
          # trigger: only distribute once the pot is worth the fixed gas of a distribution.
          # at the measured ~0.0042 ETH/h fee rate this fires roughly once a day.
          MIN_POT_ETH: ${{ github.event.inputs.min_pot_eth || '0.1' }}
          # once triggered, drain the pot properly instead of stopping at the trigger
          DRAIN_TO_ETH: ${{ github.event.inputs.drain_to_eth || '0.002' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
      # heartbeat: pings healthchecks so a stopped keeper alerts after the grace window.
      # only runs if keeper-loop succeeded (a crash skips it -> no ping -> alert). if the
      # keeper gas is low we ping /fail instead, so you are warned BEFORE it runs dry.
      # skipped entirely on a dry run — it sent no tx, so it shouldn't count as a live heartbeat.
      - name: heartbeat
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          HC: ${{ secrets.HC_DISTRIBUTE }}
          RPC: ${{ secrets.RPC }}
        run: |
          URL=$(node -e '
            const RPC=process.env.RPC||"https://rpc.mainnet.chain.robinhood.com",HC=process.env.HC;
            const K="0xfc768DA2DC6b1fB335F533EAAbFB97F6B9B85CEE";
            (async()=>{let b=0n;try{const r=await fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_getBalance",params:[K,"latest"]})});b=BigInt((await r.json()).result)}catch(e){}
            const eth=Number(b)/1e18;process.stderr.write("keeper gas "+eth.toFixed(4)+" ETH\n");
            process.stdout.write(eth<0.01?HC+"/fail":HC)})()
          ')
          curl -fsS -m 10 --retry 3 "$URL" || true
